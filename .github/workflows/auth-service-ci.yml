name: auth-service CI

on:
  push:
    branches: [dev]
    paths: [auth-service/**]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: auth-service

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: auth-service/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - run: pnpm test

      - run: pnpm dlx eslint .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: "us-east-1"

      - name: Get ECR URL
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories --repository-names auth-service \
            --query 'repositories[0].repositoryUri' --output text)
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: auth-service
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v0.58.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy image scan (scan-before-push gate)
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --format table "${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}"

      - name: Push scanned image
        run: docker push "${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}"
